{# Advertisement styling + loader. Include ONCE per page that uses .vm-ad-slot.
   Usage:
     {% include '_ads_assets.html' %}                          (once, near end of body)
     <div class="vm-ad-slot" data-position="homepage_top"></div>  (anywhere)
#}
<style>
  /* ── Fixed ad dimensions (standard banner sizes) ── */
  .vm-ad-slot{position:relative;margin:18px auto;max-width:970px;text-align:center;}
  .vm-ad-slot .vm-ad-link{display:inline-block;line-height:0;max-width:100%;}
  /* Banner image: full width up to 970px, FIXED 120px height, fit inside (no crop) */
  .vm-ad-slot .vm-ad-img{width:100%;max-width:970px;height:120px;object-fit:contain;display:block;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  .vm-ad-slot .vm-ad-tag{position:absolute;top:6px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;font-weight:700;letter-spacing:.5px;padding:1px 6px;border-radius:4px;text-transform:uppercase;}
  .vm-ad-placeholder{border:1px dashed #d8d2c8;border-radius:10px;padding:26px;color:#9a938a;font-size:12px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;background:#faf8f4;}
  /* Sidebar: 300×250 medium rectangle */
  .vm-ad-slot[data-position="sidebar"]{max-width:300px;margin:14px auto;}
  .vm-ad-slot[data-position="sidebar"] .vm-ad-img{width:300px;max-width:100%;height:250px;object-fit:contain;}
  /* Video: 16:9 fixed ratio, up to 970px wide */
  .vm-ad-slot .vm-ad-video{width:100%;max-width:970px;aspect-ratio:16/9;height:auto;object-fit:cover;border-radius:10px;display:block;margin:0 auto;background:#000;box-shadow:0 2px 10px rgba(0,0,0,.08);}
  @media(max-width:600px){ .vm-ad-slot .vm-ad-img{height:90px;} }
  .vm-ad-slot .vm-ad-audio{border:1px solid #e1dad0;border-radius:10px;padding:12px 14px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);text-align:left;}
  .vm-ad-slot .vm-ad-audio-title{font-size:13px;font-weight:700;margin-bottom:8px;color:#221f1f;}
  .vm-ad-slot .vm-ad-audio audio{width:100%;}
  .vm-ad-slot .vm-ad-cta{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:#d9252a;text-decoration:none;}
  .vm-ad-slot .vm-ad-cta:hover{text-decoration:underline;}
</style>
<script src="{{ url_for('static', filename='ads-web.js') }}?v=3" defer></script>
