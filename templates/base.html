<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Vidyarthi Mitra{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}VidyarthiMitra.org — India's trusted educational guidance portal for students. College predictor, entrance exams, admissions, career guidance and more.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}vidyarthi mitra, college predictor, MHT-CET, JEE, NEET, admissions, Maharashtra colleges, entrance exams, career guidance{% endblock %}">
    <meta name="robots" content="index, follow">
    <meta name="author" content="VidyarthiMitra.org">
    <link rel="canonical" href="{{ request.url }}">
    <!-- Open Graph -->
    <meta property="og:site_name" content="VidyarthiMitra.org">
    <meta property="og:title" content="{% block og_title %}{% block _og_title_inner %}Vidyarthi Mitra — India's Educational Guidance Portal{% endblock %}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}VidyarthiMitra.org — College predictor, entrance exam info, admissions guidance, and career counselling for Indian students.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:image" content="{{ url_for('static', filename='logo.png', _external=True) }}">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Vidyarthi Mitra — India's Educational Guidance Portal{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}College predictor, entrance exams, admissions, and career guidance for Indian students.{% endblock %}">
    <meta name="twitter:image" content="{{ url_for('static', filename='logo.png', _external=True) }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='title.png') }}">
    <!-- preconnect so DNS+TLS is resolved before stylesheets load -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- JSON-LD -->
    <script type="application/ld+json">
        {% block json_ld %}{}{% endblock %}
    </script>
    <script>
      (function() {
        const token = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
        if (token) {
          const originalFetch = window.fetch;
          window.fetch = async function() {
            let [resource, config] = arguments;
            if(config && ['POST', 'PUT', 'PATCH', 'DELETE'].includes(config.method ? config.method.toUpperCase() : 'GET')) {
                config.headers = config.headers || {};
                if(config.headers instanceof Headers) {
                    config.headers.set('X-CSRFToken', token);
                } else {
                    config.headers['X-CSRFToken'] = token;
                }
            }
            return originalFetch(resource, config);
          };
        }
      })();
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"></noscript>
    <!-- Design System Fonts: Inter + Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"></noscript>
    <!-- Design System CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='design-system.css', v='20261016c') }}">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow-x: hidden; }
        a { text-decoration: none; }
        .site-main { min-height: calc(100vh - 140px); }
    </style>
    {% block page_styles %}{% endblock %}
</head>
<body>
    {% include '_shared_index_navbar.html' %}

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    {% include '_shared_footer.html' %}

    {% block page_scripts %}{% endblock %}
</body>
</html>
